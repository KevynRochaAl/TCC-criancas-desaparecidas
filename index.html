<input type="file" id="imageInput" accept="image/*">

<div style="position: relative; display: inline-block;">
  <img id="preview" style="display:none; max-width:800px;">
  <canvas id="canvas" style="position:absolute; top:0; left:0;"></canvas>
</div>

<button onclick="enviarImagem()">Processar</button>

<script>
let imagemBase64 = "";

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

imageInput.addEventListener("change", (event) => {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        imagemBase64 = e.target.result.split(",")[1];

        preview.src = e.target.result;
        preview.style.display = "block";

        preview.onload = () => {
            canvas.width = preview.width;
            canvas.height = preview.height;
        };
    };

    reader.readAsDataURL(file);
});

async function enviarImagem() {

    try {
        const response = await fetch(
            "https://syc66fvwh44gh3gu4f5ov7ldte0tfust.lambda-url.us-east-1.on.aws/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    image: imagemBase64
                })
            }
        );
    
        const data = await response.json();
    
        desenharCaixas(data.boxes);
    } catch (error) {
        console.error("Erro ao enviar a imagem:", error);
    }
}

function desenharCaixas(boxes) {

    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;

    boxes.forEach(box => {
        ctx.strokeRect(
            box.x,
            box.y,
            box.w,
            box.h
        );
    });
}
</script>
